<head>
    <title>{% if page.title %}{{ page.title }}{% else %}{{ t.site_title }}{% endif %}</title>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="keywords" content="{{ page.title }}, {% for category in page.categories %}{{ category }},{% endfor %} {% for tag in page.tags %}{{ tag }},{% endfor %} {{ t.site_title }}" />
    <meta name="description" content="{{ page.title }}, {% for category in page.categories %}{{ category }},{% endfor %} {% for tag in page.tags %}{{ tag }},{% endfor %} {% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ t.site_description }}{% endif %}" />
    <meta name="theme-color" content="#d24939"/>
    <link rel="shortcut icon" type="image/x-icon" media="screen" href="{{ '/favicon.ico' | prepend: site.baseurl | prepend: site.url}}" />
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}" />
    <link rel="alternate" hreflang="zh-CN" href="{{ zh_url | prepend: site.baseurl | prepend: site.url }}" />
    <link rel="alternate" hreflang="en" href="{{ en_url | prepend: site.baseurl | prepend: site.url }}" />
    <link rel="alternate" hreflang="x-default" href="{{ zh_url | prepend: site.baseurl | prepend: site.url }}" />
    <meta property="og:locale" content="{{ t.html_lang | replace: '-', '_' }}" />
    <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ t.site_title }}{% endif %}" />
    <meta property="og:url" content="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}" />
    <meta property="og:site_name" content="{{ t.site_title }}" />
    <link rel="alternate" type="application/rss+xml" title="{{ t.site_title }}" href="{% if is_en %}{{ '/en/feed.xml' | prepend: site.baseurl | prepend: site.url }}{% else %}{{ '/feed.xml' | prepend: site.baseurl | prepend: site.url }}{% endif %}"  />
    <!--

        <link rel="stylesheet" href="https://cdn.bootcss.com/font-awesome/5.12.1/css/all.css" >
    -->
    <link rel="stylesheet" type="text/css" href="{{ '/static/css/bootstrap.min.css' | prepend: site.baseurl | prepend: site.url}}" />
    <link rel="stylesheet" type="text/css" href="{{ '/static/css/octicons.min.css' | prepend: site.baseurl | prepend: site.url}}" />
    <link rel="stylesheet" type="text/css" href="{{ '/static/css/all.css' | prepend: site.baseurl | prepend: site.url}}" />
    <link rel="stylesheet" type="text/css" href="{{ '/static/css/style.css' | prepend: site.baseurl | prepend: site.url}}" />
    {% for style in page.styles %}<link rel="stylesheet" type="text/css" href="{{ '/static/css/' | append: style | prepend: site.baseurl | prepend: site.url}}" />
    {%endfor%}
