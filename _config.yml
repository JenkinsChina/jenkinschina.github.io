plugins: [jekyll-paginate]
title: "Jenkins中国"
email: hummerstudio@163.com
description: "万物皆可自动化"
permalink: /post/:title
excerpt_separator: <!--以上为摘要内容-->

paginate: 5
paginate_path: "page/:num"
baseurl: ""

defaults:
  - scope:
      path: ""
    values:
      lang: zh
  - scope:
      path: "_posts_en"
      type: posts_en
    values:
      layout: post
      lang: en
      styles : [highlight.css,gitment.css,post.css]
      scripts : [post.js]
  - scope:
      path: "_wiki_en"
      type: wiki_en
    values:
      layout: wiki
      lang: en
  - scope:
      path: "_authors_en"
      type: authors_en
    values:
      layout: author
      lang: en
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      styles : [highlight.css,gitment.css,post.css]
      scripts : [post.js]
  - scope:
      path: ""
      type: "authors"
    values:
      layout: "author"
  - scope:
      path: ""
      type: "groups"
    values:
        layout: "group"

github:
  username: jenkinschina
collections:
    wiki:
        output: true
        permalink: /wiki/:path/
    wiki_en:
        output: true
        permalink: /en/wiki/:path/
    authors:
      output: true
      permalink: /author/:path/
    authors_en:
      output: true
      permalink: /en/author/:path/
    posts_en:
        output: true
        permalink: /en/post/:path
    groups:
        output: true
        permalink: /group/:path/
url: "https://www.jenkinschina.com"
imgrepo: "https://www.jenkinschina.com/static/img"

#url: "http://127.0.0.1:4000"
#imgrepo: "http://127.0.0.1:4000/static/img"